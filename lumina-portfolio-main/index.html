<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b3b2e" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/InstrumentSerif-Regular-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/Inter-Variable-latin.woff2"
      crossorigin
    />

    <title>Jai Palan</title>
    <meta
      name="description"
      content="Software engineer. Currently at OpsLevel, working on evaluation tooling for autonomous coding agents."
    />

    <!-- og:url and canonical are deliberately omitted until the production
         domain is confirmed: a wrong canonical is worse than none. Add both,
         and make og:image absolute, once the domain is settled. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jai Palan" />
    <meta property="og:title" content="Jai Palan" />
    <meta
      property="og:description"
      content="Software engineer. Currently at OpsLevel, working on evaluation tooling for autonomous coding agents."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A gold coin stamped with a J, resting on a dark table." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jai Palan" />
    <meta
      name="twitter:description"
      content="Software engineer. Currently at OpsLevel, working on evaluation tooling for autonomous coding agents."
    />
    <meta name="twitter:image" content="/og.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
